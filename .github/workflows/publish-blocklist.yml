# Signs the community list and publishes it to the community-list branch.

name: Publish community list

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [blocklist/entries.json]

concurrency:
  group: publish-blocklist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Only this job publishes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Build and sign the list
        env:
          BLOCKLIST_SIGNING_KEY: ${{ secrets.BLOCKLIST_SIGNING_KEY }}
        run: bun scripts/community-list.ts build "$RUNNER_TEMP/list"

      - name: Publish
        run: |
          cd "$RUNNER_TEMP/list"
          git init -q -b community-list
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add list.json manifest.json
          git commit -q -m "Publish community list"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" community-list
        env:
          GH_TOKEN: ${{ github.token }}
