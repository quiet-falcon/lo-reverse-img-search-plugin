# A plugin is released when the published pool doesn't have `<id>@<version>.zip` for its manifest version.
# The pool contains all relevant data. Git tags and GitHub releases are created for changelogs only.

name: Release plugins

# Manual only until 1.0.0.
on:
  workflow_dispatch:

concurrency:
  group: publish-pool
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Branch holding the pool. Set the POOL_BRANCH repository variable to move it.
  POOL_BRANCH: ${{ vars.POOL_BRANCH }}
  # Set the PAGES_BASE_URL repository variable when the pool is served from a custom domain.
  PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
  POOL_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
  PLAN: ${{ github.workspace }}/releases.json

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Only this job publishes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Existing tags, so a re-run doesn't try to recreate one.

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25

      - run: bun install --frozen-lockfile

      - name: Check out the published pool
        run: .github/scripts/checkout-pool.sh

      - name: Plan releases
        id: plan
        run: .github/scripts/plan-releases.sh

      - name: Build plugins
        if: steps.plan.outputs.count != '0'
        run: ./gradlew --no-daemon packageAllPlugins

      - name: Publish to the pool
        if: steps.plan.outputs.count != '0'
        run: .github/scripts/publish-pool.sh

      - name: Tag and write changelogs
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/tag-releases.sh
